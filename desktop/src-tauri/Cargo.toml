[package]
name = "typedee"
version = "0.1.0"
description = "Typedee — ฟอนต์ไทยแบบสมาชิก"
edition = "2021"
rust-version = "1.77"

[lib]
name = "typedee_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# บังคับ single-instance: สองตัวพร้อมกัน = register ฟอนต์ซ้ำ (Windows refcount เพี้ยน),
# แย่งกันเขียน last_tick, session_start ซ้อน — ดูแผน §Lifecycle
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# crypto — พารามิเตอร์ต้องตรงกับ `supabase/functions/_shared/device-crypto.ts` เป๊ะ
# (ตรวจด้วย fixture ที่สร้างจากไฟล์นั้นจริง ๆ ใน src/crypto.rs)
hmac = "0.12"
sha2 = "0.10"
hkdf = "0.12"
aes-gcm = "0.10"
hex = "0.4"

# release ต้องเล็กและไม่พก symbol — ไฟล์นี้ถูกเซ็นและแจกจ่าย
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
